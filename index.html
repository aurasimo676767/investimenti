<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f0" />
    <meta name="description" content="Uno spazio privato per seguire il portafoglio e studiare nuove aziende." />
    <title>Forma — il tuo spazio investimenti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navigazione principale">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>forma<span class="brand-period">.</span></span></div>
        <p class="sidebar-caption">Investire con una prospettiva più chiara.</p>
        <nav id="desktop-nav" class="nav-list"></nav>
        <div class="sidebar-bottom">
          <div class="private-note"><span class="private-dot"></span><span>Spazio personale<br /><small>I dati restano in questo browser</small></span></div>
          <div class="sidebar-footer">Una decisione alla volta.</div>
        </div>
      </aside>

      <div class="main-wrap">
        <header class="topbar">
          <div class="topbar-left"><span class="mobile-brand">forma<span>.</span></span><span id="breadcrumb">Panoramica</span></div>
          <div class="topbar-actions">
            <span id="today-label" class="today-label"></span>
            <button id="privacy-toggle" class="icon-button" type="button" aria-label="Nascondi importi" title="Nascondi importi"></button>
            <button id="open-add" class="top-add" type="button"><span aria-hidden="true">＋</span><span>Aggiungi movimento</span></button>
          </div>
        </header>
        <main id="main-content" tabindex="-1"></main>
      </div>
      <nav id="mobile-nav" class="mobile-nav" aria-label="Navigazione mobile"></nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./tr-import.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
