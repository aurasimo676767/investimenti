<!doctype html>

    <div class="ambient" aria-hidden="true"><div class="ambient-violet"></div><div class="ambient-blue"></div></div>

        <div class="nav-label">Il tuo spazio</div>

      <nav id="mobile-nav" class="mobile-nav" aria-label="Navigazione mobile"></nav>

    <script src="./tr-import.js" defer></script>
